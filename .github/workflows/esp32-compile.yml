name: ESP32 compile checks

on:
  push:
    branches: [main]
    paths:
      - "**/*.ino"
      - "**/train.py"
      - "tools/compile_esp32.py"
      - ".github/workflows/esp32-compile.yml"
  workflow_dispatch:

jobs:
  esp32-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lightweight model dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scikit-learn xgboost pandas matplotlib

      - name: Generate non-TensorFlow embedded headers
        run: python tools/run_lightweight_smoke.py

      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 Arduino core
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32

      - name: Compile non-TFLM sketches for generic ESP32
        run: python tools/compile_esp32.py
