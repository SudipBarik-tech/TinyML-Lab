name: TFLM ESP32 compile checks

on:
  push:
    branches: [main]
    paths:
      - "13-cnn/**"
      - "18-lstm/**"
      - "19-autoencoder/**"
      - "22-quantization-aware-training/**"
      - "23-post-training-pruning/**"
      - "24-knowledge-distillation/**"
      - "25-micro-mobilenet/**"
      - "31-neural-additive-model/**"
      - "32-bayesian-neural-network/**"
      - "34-recurrent-neural-network/**"
      - "37-generative-adversarial-network/**"
      - "39-quantile-regression-neural-network/**"
      - "tools/run_tensorflow_smoke.py"
      - "tools/compile_tensorflow_esp32.py"
      - ".github/workflows/tflm-esp32-compile.yml"
  workflow_dispatch:

jobs:
  tflm-esp32-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install TensorFlow dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scikit-learn tensorflow tensorflow-model-optimization

      - name: Generate TensorFlow-family embedded models
        run: python tools/run_tensorflow_smoke.py

      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 Arduino core
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32

      - name: Install Arduino TensorFlow Lite Micro library
        run: |
          mkdir -p "$HOME/Arduino/libraries"
          git clone --depth 1 https://github.com/spaziochirale/Chirale_TensorFlowLite.git "$HOME/Arduino/libraries/Chirale_TensorFlowLite"

      - name: Compile TensorFlow-family sketches for generic ESP32
        run: python tools/compile_tensorflow_esp32.py
